---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, catches ansible-core devel breakage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanity:
    name: Sanity (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible: [stable-2.16, stable-2.17, stable-2.18, stable-2.19, stable-2.20, devel]
    continue-on-error: ${{ matrix.ansible == 'devel' }}
    steps:
      - uses: ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: sanity

  units:
    name: Units (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible: [stable-2.16, stable-2.18, stable-2.20, devel]
    continue-on-error: ${{ matrix.ansible == 'devel' }}
    steps:
      - uses: ansible-community/ansible-test-gh-action@release/v1
        with:
          ansible-core-version: ${{ matrix.ansible }}
          testing-type: units

  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ansible/ansible-lint@v25

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core antsibull-changelog
      - run: antsibull-changelog lint
      - run: python docs/generate_docs.py --check
      - run: ansible-galaxy collection build
      - uses: actions/upload-artifact@v4
        with:
          name: collection
          path: wallix-bastion-*.tar.gz
