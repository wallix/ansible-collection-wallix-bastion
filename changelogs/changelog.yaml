      name: device_localdomain
      namespace: ''
    - description: Manage accounts of a device local domain on a WALLIX Bastion
      name: device_localdomain_account
      namespace: ''
    - description: Manage credentials of a device local domain account on a WALLIX
        Bastion
      name: device_localdomain_account_credential
      namespace: ''
    - description: Get the credentials of a device local domain account from a WALLIX
