ancestor: null
releases:
  1.0.0:
    changes:
      release_summary: 'First release of wallix.bastion, a rewrite of wallix.pam modeled
        on the wallix-bastion Terraform provider: one idempotent module per Bastion
        API object, with check mode and diff support.'
