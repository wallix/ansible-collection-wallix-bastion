ancestor: null
releases:
  1.0.0:
    changes:
      release_summary: 'First release of wallix.bastion, a rewrite of wallix.pam modeled
        on the wallix-bastion Terraform provider: one idempotent module per Bastion
        API object, with check mode and diff support.'
    fragments:
    - 1.0.0.yml
    modules:
    - description: Manage authorizations on a WALLIX Bastion
      name: authorization
      namespace: ''
    - description: Get authorizations from a WALLIX Bastion
      name: authorization_info
      namespace: ''
