      namespace: ''
    plugins:
      lookup:
      - description: Check out account secrets from a WALLIX Bastion
        name: secret
        namespace: null
    release_date: '2026-10-01'
  1.1.0:
    changes:
      breaking_changes:
      - The connection option ``timeout`` (HTTP timeout of each request to the Bastion
        API) is renamed ``bastion_timeout``, like the other connection options. The
        name ``timeout`` is now free for the API field of the same name, for example
        in ``wallix.bastion.externalauth_ldap``.
      release_summary: 'Complete coverage of the wallix-bastion Terraform provider:
        a module for every resource and an ``_info`` module for every data source.'
