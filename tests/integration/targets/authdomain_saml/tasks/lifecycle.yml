---
# Full lifecycle of wallix.bastion.authdomain_saml against a real Bastion.
# Connection comes from main.yml (module_defaults). The SAML identity providers the domain
# needs are created with raw API calls (externalauth.yml) and point at example.com.
- name: Pick unique test names
  ansible.builtin.set_fact:
    test_domain: ansible-test-saml-{{ test_suffix }}
    test_idp1: ansible-test-idp1-{{ test_suffix }}
    test_idp2: ansible-test-idp2-{{ test_suffix }}
    test_saml_body:
      type: SAML
      timeout: 10
      claim_customization:
        username: email
      idp_metadata: |-
        <?xml version="1.0"?>
        <md:EntityDescriptor xmlns:md="urn:oasis:names:tc:SAML:2.0:metadata" entityID="https://idp.example.com/saml">
          <md:IDPSSODescriptor protocolSupportEnumeration="urn:oasis:names:tc:SAML:2.0:protocol">
            <md:SingleSignOnService Binding="urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect" Location="https://idp.example.com/sso"/>
          </md:IDPSSODescriptor>
        </md:EntityDescriptor>
  vars:
    test_suffix: "{{ lookup('ansible.builtin.password', '/dev/null', length=8, chars=['ascii_lowercase', 'digits']) }}"

- name: Authentication domain lifecycle
  block:
    - name: Create the SAML identity providers
      ansible.builtin.include_tasks: externalauth.yml
      vars:
        externalauth_state: present
        externalauth_name: "{{ item }}"
        externalauth_body: "{{ test_saml_body }}"
      loop: ["{{ test_idp1 }}", "{{ test_idp2 }}"]

    - name: Create domain (check mode)
      wallix.bastion.authdomain_saml:
        domain_name: "{{ test_domain }}"
        auth_domain_name: sso.example.com
        default_email_domain: example.com
        default_language: en
        external_auths: ["{{ test_idp1 }}"]
        label: Sign in with the test IdP
      check_mode: true
      register: create_check

    - name: Look up domain after check mode
      wallix.bastion.authdomain_saml_info:
        domain_name: "{{ test_domain }}"
      register: after_check

    - name: Create domain without a label
      wallix.bastion.authdomain_saml:
        domain_name: "{{ test_domain }}"
        auth_domain_name: sso.example.com
        default_email_domain: example.com
        default_language: en
        external_auths: ["{{ test_idp1 }}"]
      register: create_missing
      ignore_errors: true

    - name: Assert check mode reported a change without making it, and label is required
      ansible.builtin.assert:
        that:
          - create_check is changed
          - after_check.authdomains | length == 0
          - create_missing is failed
          - "'label required' in create_missing.msg"

    - name: Create domain
      wallix.bastion.authdomain_saml:
        domain_name: "{{ test_domain }}"
        auth_domain_name: sso.example.com
        default_email_domain: example.com
        default_language: en
        external_auths: ["{{ test_idp1 }}", "{{ test_idp2 }}"]
        label: Sign in with the test IdP
        description: Created by the wallix.bastion integration tests
      register: create

    - name: Create domain again
      wallix.bastion.authdomain_saml:
        domain_name: "{{ test_domain }}"
        auth_domain_name: sso.example.com
        default_email_domain: example.com
        default_language: en
        external_auths: ["{{ test_idp1 }}", "{{ test_idp2 }}"]
        label: Sign in with the test IdP
        description: Created by the wallix.bastion integration tests
        force_authn: false
      register: create_again

    - name: Assert domain was created once
      ansible.builtin.assert:
        that:
          - create is changed
          - create.authdomain.id | length > 0
          - create.authdomain.type == 'SAML'
          - create.authdomain.external_auths == [test_idp1, test_idp2]
          - create.authdomain.idp_initiated_url is search('domain=' ~ test_domain)
          - not create.authdomain.force_authn
          - create_again is not changed
          - create_again.changed_fields == []

    - name: Remove an identity provider and change the SAML options
      wallix.bastion.authdomain_saml:
        domain_name: "{{ test_domain }}"
        external_auths: ["{{ test_idp2 }}"]
        label: New label
        force_authn: true
      diff: true
      register: update

    - name: Change them again
      wallix.bastion.authdomain_saml:
        domain_name: "{{ test_domain }}"
        external_auths: ["{{ test_idp2 }}"]
        label: New label
        force_authn: true
      register: update_again

    - name: Assert the update replaced the list and kept the other options
      ansible.builtin.assert:
        that:
          - update is changed
          - update.changed_fields == ['external_auths', 'force_authn', 'label']
          - update.diff.before.label == 'Sign in with the test IdP'
          - update.authdomain.external_auths == [test_idp2]
          - update.authdomain.label == 'New label'
          - update.authdomain.force_authn
          - update.authdomain.description == 'Created by the wallix.bastion integration tests'
          - update.authdomain.auth_domain_name == 'sso.example.com'
          - update_again is not changed

    - name: Manage the domain with the module of another type
      wallix.bastion.authdomain_azuread:
        domain_name: "{{ test_domain }}"
        label: wrong type
      register: wrong_type
      ignore_errors: true

    - name: Look up domain
      wallix.bastion.authdomain_saml_info:
        domain_name: "{{ test_domain }}"
      register: info

    - name: Look up domain as an AD domain
      wallix.bastion.authdomain_ad_info:
        domain_name: "{{ test_domain }}"
      register: info_ad

    - name: Assert the type is checked
      ansible.builtin.assert:
        that:
          - wrong_type is failed
          - "'type SAML' in wrong_type.msg"
          - info.authdomains | length == 1
          - info.authdomains[0].label == 'New label'
          - info_ad.authdomains == []

    - name: Delete domain
      wallix.bastion.authdomain_saml:
        domain_name: "{{ test_domain }}"
        state: absent
      register: delete

    - name: Delete domain again
      wallix.bastion.authdomain_saml:
        domain_name: "{{ test_domain }}"
        state: absent
      register: delete_again

    - name: Look up domain after delete
      wallix.bastion.authdomain_saml_info:
        domain_name: "{{ test_domain }}"
      register: after_delete

    - name: Assert domain is gone and second delete is a no-op
      ansible.builtin.assert:
        that:
          - delete is changed
          - delete_again is not changed
          - after_delete.authdomains | length == 0

  always:
    - name: Clean up test domain
      wallix.bastion.authdomain_saml:
        domain_name: "{{ test_domain }}"
        state: absent

    - name: Clean up the SAML identity providers
      ansible.builtin.include_tasks: externalauth.yml
      vars:
        externalauth_state: absent
        externalauth_name: "{{ item }}"
      loop: ["{{ test_idp1 }}", "{{ test_idp2 }}"]
