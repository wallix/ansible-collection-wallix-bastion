---
# Full lifecycle of wallix.bastion.domain_account_credential against a real Bastion.
# Connection comes from main.yml (module_defaults).
- name: Pick unique test names
  ansible.builtin.set_fact:
    test_domain: ansible-test-dcred-{{ lookup('ansible.builtin.password', '/dev/null', length=8, chars=['ascii_lowercase', 'digits']) }}
    test_account: ansible-test-account
    test_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=16) }}Aa1%"

- name: Domain account credential lifecycle
  block:
    - name: Create the parent domain
      wallix.bastion.domain:
        domain_name: "{{ test_domain }}"

    - name: Create password in a missing account
      wallix.bastion.domain_account_credential:
        domain_name: "{{ test_domain }}"
        account_name: "{{ test_account }}"
        type: password
        password: "{{ test_password }}"
      register: no_account
      ignore_errors: true

    - name: Assert a missing account fails
      ansible.builtin.assert:
        that:
          - no_account is failed
          - no_account.msg == 'account ' ~ test_account ~ ' does not exist'

    - name: Create the parent account
      wallix.bastion.domain_account:
        domain_name: "{{ test_domain }}"
        account_name: "{{ test_account }}"
        account_login: admin

    - name: Create password (check mode)
      wallix.bastion.domain_account_credential:
        domain_name: "{{ test_domain }}"
        account_name: "{{ test_account }}"
        type: password
        password: "{{ test_password }}"
      check_mode: true
      register: create_check

    - name: Look up credentials after check mode
      wallix.bastion.domain_account_credential_info:
        domain_name: "{{ test_domain }}"
        account_name: "{{ test_account }}"
      register: after_check

    - name: Assert check mode reported a change without making it
      ansible.builtin.assert:
        that:
          - create_check is changed
          - after_check.domain_account_credentials | length == 0

    - name: Create password
      wallix.bastion.domain_account_credential:
        domain_name: "{{ test_domain }}"
        account_name: "{{ test_account }}"
        type: password
        password: "{{ test_password }}"
      register: create

    - name: Assert password was created and not returned
      ansible.builtin.assert:
        that:
          - create is changed
          - create.domain_account_credential.id | length > 0
          - create.domain_account_credential.type == 'password'
          - "'password' not in create.domain_account_credential"

    - name: Create password again
      wallix.bastion.domain_account_credential:
        domain_name: "{{ test_domain }}"
        account_name: "{{ test_account }}"
        type: password
        password: "{{ test_password }}"
      register: create_again

    - name: Assert second create is a no-op
      ansible.builtin.assert:
        that:
          - create_again is not changed
          - create_again.domain_account_credential.id == create.domain_account_credential.id

    - name: Change password
      wallix.bastion.domain_account_credential:
        domain_name: "{{ test_domain }}"
        account_name: "{{ test_account }}"
        type: password
        password: "{{ test_password }}-2"
        update_password: always
      register: update

    - name: Assert password was sent in place
      ansible.builtin.assert:
        that:
          - update is changed
          - update.changed_fields == ['password']
          - update.domain_account_credential.id == create.domain_account_credential.id

    - name: Create SSH key generated by the Bastion
      wallix.bastion.domain_account_credential:
        domain_name: "{{ test_domain }}"
        account_name: "{{ test_account }}"
        type: ssh_key
        private_key: generate:ED25519
      register: ssh_key

    - name: Create SSH key again
      wallix.bastion.domain_account_credential:
        domain_name: "{{ test_domain }}"
        account_name: "{{ test_account }}"
        type: ssh_key
        private_key: generate:ED25519
      register: ssh_key_again

    - name: Replace the SSH key in place
      wallix.bastion.domain_account_credential:
        domain_name: "{{ test_domain }}"
        account_name: "{{ test_account }}"
        type: ssh_key
        private_key: generate:ED25519
        update_password: always
      register: ssh_key_always

    - name: Get the SSH key
      wallix.bastion.domain_account_credential_info:
        domain_name: "{{ test_domain }}"
        account_name: "{{ test_account }}"
        type: ssh_key
      register: ssh_info

    - name: Assert the SSH key was created once, then replaced in place
      ansible.builtin.assert:
        that:
          - ssh_key is changed
          - ssh_key.domain_account_credential.public_key | length > 0
          - "'private_key' not in ssh_key.domain_account_credential"
          - ssh_key_again is not changed
          - ssh_key_always is changed
          - ssh_key_always.domain_account_credential.id == ssh_key.domain_account_credential.id
          - ssh_key_always.domain_account_credential.public_key != ssh_key.domain_account_credential.public_key
          - ssh_info.domain_account_credentials | length == 1
          - ssh_info.domain_account_credentials[0].public_key == ssh_key_always.domain_account_credential.public_key

    - name: Delete password
      wallix.bastion.domain_account_credential:
        domain_name: "{{ test_domain }}"
        account_name: "{{ test_account }}"
        type: password
        state: absent
      register: delete

    - name: Delete password again
      wallix.bastion.domain_account_credential:
        domain_name: "{{ test_domain }}"
        account_name: "{{ test_account }}"
        type: password
        state: absent
      register: delete_again

    - name: Look up credentials after delete
      wallix.bastion.domain_account_credential_info:
        domain_name: "{{ test_domain }}"
        account_name: "{{ test_account }}"
      register: after_delete

    - name: Assert only the password is gone and second delete is a no-op
      ansible.builtin.assert:
        that:
          - delete is changed
          - delete_again is not changed
          - after_delete.domain_account_credentials | map(attribute='type') | list == ['ssh_key']

  always:
    - name: Clean up test domain, its account and credentials
      wallix.bastion.domain:
        domain_name: "{{ test_domain }}"
        state: absent
