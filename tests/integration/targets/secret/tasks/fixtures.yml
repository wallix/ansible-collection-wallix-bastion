---
# Throwaway objects for a checkout: a locking checkout policy, a device with a local domain and
# an account holding a password, and a user granted password retrieval on that account through
# its own user group, target group and authorization. Each id is kept for cleanup.yml.
- name: Create checkout policy that locks the account
  ansible.builtin.uri:
    url: "{{ bastion_api }}/checkoutpolicies"
    method: POST
    status_code: 204
    body:
      checkout_policy_name: "{{ test_name }}"
      description: Created by the wallix.bastion integration tests
      enable_lock: true
      change_credentials_at_checkin: false
      duration: 600
      extension: 300
      max_duration: 3600
  register: fixture_policy

- name: Create device
  ansible.builtin.uri:
    url: "{{ bastion_api }}/devices"
    method: POST
    status_code: 204
    body:
      device_name: "{{ test_name }}"
      host: 192.0.2.60
      description: Created by the wallix.bastion integration tests
  register: fixture_device

- name: Create local domain
  ansible.builtin.uri:
    url: "{{ bastion_api }}/devices/{{ fixture_device.x_object_id }}/localdomains"
    method: POST
    status_code: 204
    body:
      domain_name: local
      description: ""
  register: fixture_domain

- name: Create account with a password
  ansible.builtin.uri:
    url: "{{ bastion_api }}/devices/{{ fixture_device.x_object_id }}/localdomains/{{ fixture_domain.x_object_id }}/accounts"
    method: POST
    status_code: 204
    body:
      account_name: svc
      account_login: svc-login
      description: ""
      auto_change_password: false
      auto_change_ssh_key: false
      checkout_policy: "{{ test_name }}"
      services: []
      credentials:
        - type: password
          password: "{{ test_account_password }}"
  no_log: true

- name: Create target group with password retrieval on the account
  ansible.builtin.uri:
    url: "{{ bastion_api }}/targetgroups"
    method: POST
    status_code: 204
    body:
      group_name: "{{ test_name }}"
      description: ""
      password_retrieval:
        accounts:
          - {account: svc, domain: local, domain_type: local, device: "{{ test_name }}"}
      restrictions: []
      session: {accounts: [], account_mappings: [], interactive_logins: [], scenario_accounts: []}
  register: fixture_targetgroup

- name: Create user group
  ansible.builtin.uri:
    url: "{{ bastion_api }}/usergroups"
    method: POST
    status_code: 204
    body:
      group_name: "{{ test_name }}"
      description: ""
      profile: user
      timeframes: [allthetime]
      restrictions: []
  register: fixture_usergroup

- name: Create user in the user group
  ansible.builtin.uri:
    url: "{{ bastion_api }}/users"
    method: POST
    status_code: 204
    body:
      user_name: "{{ test_name }}"
      display_name: ""
      email: "{{ test_name }}@example.com"
      profile: user
      user_auths: [local_password]
      password: "{{ test_user_password }}"
      groups: ["{{ test_name }}"]
      force_change_pwd: false
  no_log: true
  register: fixture_user

- name: Create authorization granting password retrieval
  ansible.builtin.uri:
    url: "{{ bastion_api }}/authorizations"
    method: POST
    status_code: 204
    body:
      authorization_name: "{{ test_name }}"
      description: ""
      user_group: "{{ test_name }}"
      target_group: "{{ test_name }}"
      authorize_password_retrieval: true
      authorize_sessions: false
      approval_required: false
      is_critical: false
      is_recorded: false
  register: fixture_authorization
