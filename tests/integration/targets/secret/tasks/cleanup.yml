---
# Delete what fixtures.yml created, by the ids it registered. Deleting the device removes its
# local domain and account. Runs even when a fixture or a test failed.
- name: Delete authorization
  ansible.builtin.uri:
    url: "{{ bastion_api }}/authorizations/{{ fixture_authorization.x_object_id }}"
    method: DELETE
    status_code: [204, 404]
  when: fixture_authorization is defined and fixture_authorization is succeeded

- name: Delete user
  ansible.builtin.uri:
    url: "{{ bastion_api }}/users/{{ test_name }}"
    method: DELETE
    status_code: [204, 404]
  when: fixture_user is defined and fixture_user is succeeded

- name: Delete user group
  ansible.builtin.uri:
    url: "{{ bastion_api }}/usergroups/{{ fixture_usergroup.x_object_id }}"
    method: DELETE
    status_code: [204, 404]
  when: fixture_usergroup is defined and fixture_usergroup is succeeded

- name: Delete target group
  ansible.builtin.uri:
    url: "{{ bastion_api }}/targetgroups/{{ fixture_targetgroup.x_object_id }}"
    method: DELETE
    status_code: [204, 404]
  when: fixture_targetgroup is defined and fixture_targetgroup is succeeded

- name: Delete device
  ansible.builtin.uri:
    url: "{{ bastion_api }}/devices/{{ fixture_device.x_object_id }}"
    method: DELETE
    status_code: [204, 404]
  when: fixture_device is defined and fixture_device is succeeded

- name: Delete checkout policy
  ansible.builtin.uri:
    url: "{{ bastion_api }}/checkoutpolicies/{{ fixture_policy.x_object_id }}"
    method: DELETE
    status_code: [204, 404]
  when: fixture_policy is defined and fixture_policy is succeeded
