---
# Checkout, extend and checkin as the fixture user. Connection from main.yml (module_defaults).
- name: Check out in check mode
  wallix.bastion.secret:
    account: svc
    domain: local
    device: "{{ test_name }}"
  check_mode: true
  register: checkout_check

- name: Check in after check mode
  wallix.bastion.secret:
    account: svc
    domain: local
    device: "{{ test_name }}"
    state: checkin
  register: checkin_after_check

- name: Assert check mode returned no secret and checked nothing out
  ansible.builtin.assert:
    that:
      - checkout_check is changed
      - checkout_check.password is not defined
      - checkout_check.checkout == {}
      - checkin_after_check is not changed

- name: Check out
  wallix.bastion.secret:
    account: svc
    domain: local
    device: "{{ test_name }}"
    duration: 120
  register: checkout
  no_log: true

- name: Assert the password was checked out and the account locked
  ansible.builtin.assert:
    that:
      - checkout is changed
      - checkout.target == 'svc@local@' ~ test_name
      - checkout.login == 'svc-login'
      - checkout.password == test_account_password
      - checkout.checkout.locked
      - checkout.checkout.remaining_time <= 120
      - checkout.checkout.password is not defined
  no_log: true

- name: Extend the checkout through the named authorization
  wallix.bastion.secret:
    account: svc
    domain: local
    device: "{{ test_name }}"
    authorization: "{{ test_name }}"
    state: extend
  register: extend

- name: Assert the checkout was extended
  ansible.builtin.assert:
    that:
      - extend is changed
      - extend.checkout.extended
      - extend.checkout.remaining_time > checkout.checkout.remaining_time
      - extend.password is not defined

- name: Read the password with the lookup and check in at once
  ansible.builtin.set_fact:
    looked_up: "{{ lookup('wallix.bastion.secret', target, checkin=true, bastion_user=test_name, bastion_password=test_user_password, bastion_token='') }}"
  vars:
    target: svc@local@{{ test_name }}
  no_log: true

- name: Check in after the lookup's checkin
  wallix.bastion.secret:
    account: svc
    domain: local
    device: "{{ test_name }}"
    state: checkin
  register: checkin_after_lookup

- name: Assert the lookup returned the password and checked in
  ansible.builtin.assert:
    that:
      - looked_up == test_account_password
      - checkin_after_lookup is not changed
  no_log: true

- name: Check out again
  wallix.bastion.secret:
    account: svc
    domain: local
    device: "{{ test_name }}"
  register: checkout_again
  no_log: true

- name: Check in
  wallix.bastion.secret:
    account: svc
    domain: local
    device: "{{ test_name }}"
    state: checkin
  register: checkin

- name: Check in again
  wallix.bastion.secret:
    account: svc
    domain: local
    device: "{{ test_name }}"
    state: checkin
  register: checkin_again

- name: Extend after checkin
  wallix.bastion.secret:
    account: svc
    domain: local
    device: "{{ test_name }}"
    state: extend
  register: extend_after_checkin
  ignore_errors: true

- name: Assert checkin released the account once
  ansible.builtin.assert:
    that:
      - checkout_again is changed
      - checkin is changed
      - checkin_again is not changed
      - extend_after_checkin is failed
      - extend_after_checkin.status == 409
      - "'NOT_CHECKED_OUT' in extend_after_checkin.msg"

- name: Check out an account the user may not retrieve
  wallix.bastion.secret:
    account: nobody
    domain: local
    device: "{{ test_name }}"
  register: unknown
  ignore_errors: true

- name: Look up the account as the administrator, who has no authorization on it
  ansible.builtin.set_fact:
    admin_lookup: "{{ lookup('wallix.bastion.secret', 'svc@local@' ~ test_name) }}"
  register: admin_lookup_result
  ignore_errors: true

- name: Assert both failures are clean and leak no secret
  ansible.builtin.assert:
    that:
      - unknown is failed
      - unknown.status == 403
      - "'NOT_AUTHORIZED' in unknown.msg"
      - unknown.password is not defined
      - test_account_password not in (unknown | to_json)
      - admin_lookup_result is failed
      - "'NOT_AUTHORIZED' in admin_lookup_result.msg"
      - test_account_password not in (admin_lookup_result | to_json)
