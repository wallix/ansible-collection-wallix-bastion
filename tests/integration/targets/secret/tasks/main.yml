---
# wallix.bastion.secret (module and lookup) against a real Bastion.
#
# A checkout needs an account the authenticated user may retrieve, so fixtures.yml creates,
# with raw API calls, a throwaway user who is granted password retrieval on a throwaway
# account. Only ansible-test-* objects are created, and they are all deleted in cleanup.yml.
- name: Set test names and the raw API connection
  ansible.builtin.set_fact:
    test_name: ansible-test-secret-{{ lookup('ansible.builtin.password', '/dev/null', length=8, chars=['ascii_lowercase', 'digits']) }}
    test_account_password: Acct-{{ lookup('ansible.builtin.password', '/dev/null', length=16, chars=['ascii_letters', 'digits']) }}
    test_user_password: Usr-{{ lookup('ansible.builtin.password', '/dev/null', length=16, chars=['ascii_letters', 'digits']) }}!a1
    bastion_api: https://{{ wallix_bastion_host }}:{{ wallix_bastion_port | default(443) }}/api/{{ wallix_bastion_api_version | default('v3.12') }}
    bastion_api_headers: >-
      {{ {'X-Auth-User': wallix_bastion_user, 'X-Auth-Key': wallix_bastion_token}
         if wallix_bastion_token is defined else {} }}

- name: Run tests
  module_defaults:
    ansible.builtin.uri:
      headers: "{{ bastion_api_headers }}"
      url_username: "{{ omit if wallix_bastion_token is defined else wallix_bastion_user }}"
      url_password: "{{ omit if wallix_bastion_token is defined else wallix_bastion_password }}"
      force_basic_auth: "{{ wallix_bastion_token is not defined }}"
      validate_certs: "{{ wallix_bastion_validate_certs | default(true) }}"
      body_format: json
    wallix.bastion.secret:
      bastion_host: "{{ wallix_bastion_host }}"
      bastion_port: "{{ wallix_bastion_port | default(omit) }}"
      bastion_user: "{{ test_name }}"
      bastion_password: "{{ test_user_password }}"
      api_version: "{{ wallix_bastion_api_version | default(omit) }}"
      validate_certs: "{{ wallix_bastion_validate_certs | default(omit) }}"
  block:
    - name: Create fixtures
      ansible.builtin.include_tasks: fixtures.yml

    - name: Checkout cycle
      ansible.builtin.include_tasks: cycle.yml

  always:
    - name: Delete fixtures
      ansible.builtin.include_tasks: cleanup.yml
