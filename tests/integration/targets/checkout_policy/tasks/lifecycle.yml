---
# Full lifecycle of wallix.bastion.checkout_policy against a real Bastion.
# Connection comes from main.yml (module_defaults). The built-in "default" policy is only read.
- name: Pick a unique test policy name
  ansible.builtin.set_fact:
    test_policy: ansible-test-checkout-{{ lookup('ansible.builtin.password', '/dev/null', length=8, chars=['ascii_lowercase', 'digits']) }}

- name: Checkout policy lifecycle
  block:
    - name: Create policy (check mode)
      wallix.bastion.checkout_policy:
        checkout_policy_name: "{{ test_policy }}"
        description: Created by the wallix.bastion integration tests
        enable_lock: true
        duration: 3600
        extension: 600
        max_duration: 7200
        change_credentials_at_checkin: true
      check_mode: true
      register: create_check

    - name: Look up policy after check mode
      wallix.bastion.checkout_policy_info:
        checkout_policy_name: "{{ test_policy }}"
      register: after_check

    - name: Assert check mode reported a change without making it
      ansible.builtin.assert:
        that:
          - create_check is changed
          - after_check.checkout_policies | length == 0

    - name: Create policy
      wallix.bastion.checkout_policy:
        checkout_policy_name: "{{ test_policy }}"
        description: Created by the wallix.bastion integration tests
        enable_lock: true
        duration: 3600
        extension: 600
        max_duration: 7200
        change_credentials_at_checkin: true
      register: create

    - name: Assert policy was created
      ansible.builtin.assert:
        that:
          - create is changed
          - create.checkout_policy.id | length > 0
          - create.checkout_policy.enable_lock
          - create.checkout_policy.duration == 3600
          - create.checkout_policy.extension == 600
          - create.checkout_policy.max_duration == 7200
          - create.checkout_policy.change_credentials_at_checkin

    - name: Create policy again
      wallix.bastion.checkout_policy:
        checkout_policy_name: "{{ test_policy }}"
        description: Created by the wallix.bastion integration tests
        enable_lock: true
        duration: 3600
        extension: 600
        max_duration: 7200
        change_credentials_at_checkin: true
      register: create_again

    - name: Assert second create is a no-op
      ansible.builtin.assert:
        that:
          - create_again is not changed
          - create_again.checkout_policy.id == create.checkout_policy.id

    - name: Change the duration only
      wallix.bastion.checkout_policy:
        checkout_policy_name: "{{ test_policy }}"
        duration: 1800
      diff: true
      register: update

    - name: Assert duration changed and the rest was kept
      ansible.builtin.assert:
        that:
          - update is changed
          - update.changed_fields == ['duration']
          - update.checkout_policy.duration == 1800
          - update.checkout_policy.max_duration == 7200
          - update.checkout_policy.description == 'Created by the wallix.bastion integration tests'
          - update.diff.before.duration == 3600

    - name: Disable the lock
      wallix.bastion.checkout_policy:
        checkout_policy_name: "{{ test_policy }}"
        enable_lock: false
      register: unlock

    - name: Disable the lock again
      wallix.bastion.checkout_policy:
        checkout_policy_name: "{{ test_policy }}"
        enable_lock: false
      register: unlock_again

    - name: Assert the Bastion reset the lock settings
      ansible.builtin.assert:
        that:
          - unlock is changed
          - unlock_again is not changed
          - not unlock.checkout_policy.enable_lock
          - unlock.checkout_policy.duration == 0
          - not unlock.checkout_policy.change_credentials_at_checkin

    - name: Set a duration without lock
      wallix.bastion.checkout_policy:
        checkout_policy_name: "{{ test_policy }}"
        duration: 600
      register: no_lock
      ignore_errors: true

    - name: Assert the module refused it
      ansible.builtin.assert:
        that:
          - no_lock is failed
          - "'require enable_lock=true' in no_lock.msg"

    - name: Read the built-in default policy
      wallix.bastion.checkout_policy_info:
        checkout_policy_name: default
      register: default_policy

    - name: List every policy
      wallix.bastion.checkout_policy_info:
      register: all_policies

    - name: Assert info returns the policies
      ansible.builtin.assert:
        that:
          - default_policy.checkout_policies | length == 1
          - default_policy.checkout_policies[0].checkout_policy_name == 'default'
          - test_policy in all_policies.checkout_policies | map(attribute='checkout_policy_name')

    - name: Delete policy
      wallix.bastion.checkout_policy:
        checkout_policy_name: "{{ test_policy }}"
        state: absent
      register: delete

    - name: Delete policy again
      wallix.bastion.checkout_policy:
        checkout_policy_name: "{{ test_policy }}"
        state: absent
      register: delete_again

    - name: Look up policy after delete
      wallix.bastion.checkout_policy_info:
        checkout_policy_name: "{{ test_policy }}"
      register: after_delete

    - name: Assert policy is gone and second delete is a no-op
      ansible.builtin.assert:
        that:
          - delete is changed
          - delete_again is not changed
          - after_delete.checkout_policies | length == 0

  always:
    - name: Clean up test policy
      wallix.bastion.checkout_policy:
        checkout_policy_name: "{{ test_policy }}"
        state: absent
